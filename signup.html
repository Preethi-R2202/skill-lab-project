<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — Digital Time Capsule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .form-error { display:none; background:var(--mood-excited-bg); color:#B3562F; border-radius:var(--radius-s); padding:10px 14px; font-size:0.85rem; margin-bottom:14px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">⏳</span> Digital Time Capsule</div>
    <h1>Create your account</h1>
    <p class="sub">Start saving your memories for the future.</p>

    <div class="form-error" id="signup-error"></div>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="su-name">Full Name</label>
        <input id="su-name" type="text" placeholder="Enter your name" required>
      </div>
      <div class="field">
        <label for="su-email">Email Address</label>
        <input id="su-email" type="email" placeholder="Enter your email" required>
      </div>
      <div class="field">
        <label for="su-pass">Password</label>
        <div class="input-wrap">
          <input id="su-pass" type="password" placeholder="Create a password (min 4 characters)" required minlength="4">
          <button type="button" class="toggle-eye" data-toggle-pass="#su-pass">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
