<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Digital Time Capsule</title>
  <meta name="description" content="Manage and view your locked, ready, and opened digital time capsules.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar-overlay" data-close-sidebar></div>
<div class="app-shell">

  <aside class="sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">⏳</span> Digital Time Capsule</a>
    <nav>
      <a href="dashboard.html" class="active"><span class="ico">🏠</span> Dashboard</a>
      <a href="create-capsule.html"><span class="ico">➕</span> Create Capsule</a>
      <a href="capsule-details.html"><span class="ico">📦</span> My Capsules</a>
      <a href="archive.html"><span class="ico">🗂️</span> Archive</a>
      <a href="profile.html"><span class="ico">⚙️</span> Profile &amp; Settings</a>
    </nav>
    <a href="#" class="logout" data-logout><span class="ico">↩</span> Log Out</a>
  </aside>

  <div class="mobile-topbar">
    <button class="icon-btn" data-open-sidebar aria-label="Open menu">☰</button>
    <div class="brand" style="font-size:1rem;"><span class="brand-mark">⏳</span> Digital Time Capsule</div>
    <span class="avatar">P</span>
  </div>

  <main class="app-main">
    <div class="app-topbar">
      <div class="search">
        🔍 <input type="text" placeholder="Search your capsules…" data-search style="border:none; background:none; outline:none; font-size:0.88rem; width:100%; color:var(--ink);">
      </div>
      <div class="actions">
        <button class="icon-btn" title="Toggle theme">🌙</button>
        <button class="icon-btn" title="Notifications" onclick="alert('You will be notified when your capsules unlock.')">🔔</button>
        <a href="profile.html" class="user-chip"><span class="avatar">P</span> Preethi R ▾</a>
      </div>
    </div>

    <div class="app-content">
      <h2>Hello, Preethi!</h2>
      <p>Here are your sealed and discovered memories.</p>

      <div class="stat-row">
        <div class="stat-card locked">
          <div class="stat-ico">🔒</div>
          <div><div class="num">0</div><div class="label">Locked</div></div>
        </div>
        <div class="stat-card ready">
          <div class="stat-ico">⏰</div>
          <div><div class="num">0</div><div class="label">Ready to Open</div></div>
        </div>
        <div class="stat-card opened">
          <div class="stat-ico">✅</div>
          <div><div class="num">0</div><div class="label">Opened</div></div>
        </div>
      </div>

      <div class="section-head">
        <h3>Your Capsules</h3>
        <a href="create-capsule.html" class="btn btn-primary btn-sm">+ New Capsule</a>
      </div>
      <div class="capsule-list">
        <!-- Rendered dynamically by script.js -->
      </div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
