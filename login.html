<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome back — Digital Time Capsule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .form-error { display:none; background:var(--mood-excited-bg); color:#B3562F; border-radius:var(--radius-s); padding:10px 14px; font-size:0.85rem; margin-bottom:14px; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">⏳</span> Digital Time Capsule</div>
    <h1>Welcome Back!</h1>
    <p class="sub">Log in to continue to your time capsule.</p>

    <div class="form-error" id="login-error"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="li-email">Email Address</label>
        <input id="li-email" type="email" placeholder="Enter your email" required>
      </div>
      <div class="field">
        <label for="li-pass">Password</label>
        <div class="input-wrap">
          <input id="li-pass" type="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-eye" data-toggle-pass="#li-pass">Show</button>
        </div>
      </div>
      <div class="row-between">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="auth-foot" style="margin-top:14px;">Don't have an account? <a href="signup.html">Sign Up</a></p>
    <p class="auth-foot" style="font-size:0.78rem;">Demo tip: sign up first — accounts are stored in this browser only.</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
